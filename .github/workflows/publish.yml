# Build the image for linux/arm64 and publish it to ghcr.io/autorunhq/switch-dev
# under the pushed tag, the date it is cut (such as 2026.09.28), and latest.
name: publish
on:
  push:
    tags: ['20*']
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/autorunhq/switch-dev:${{ inputs.tag || github.ref_name }}
            ghcr.io/autorunhq/switch-dev:latest
